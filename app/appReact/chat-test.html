<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>WebSocket STOMP 测试（旧版stomp.js）</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
        }

        #messages {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }

        .msg {
            margin: 5px 0;
        }

        .sender {
            font-weight: bold;
            color: #2c3e50;
        }

        .time {
            font-size: 0.8em;
            color: #888;
        }

        .content {
            margin-left: 10px;
        }

        input[type=text] {
            width: 70%;
            padding: 5px;
        }

        button {
            padding: 5px 15px;
        }

        .status {
            color: #e67e22;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <h2>WebSocket STOMP 聊天测试</h2>
    <div class="status" id="status">未连接</div>

    <div>
        <button onclick="connectAndSubscribe()">连接并订阅房间</button>
        <button onclick="disconnect()">断开</button>
    </div>
    <hr>
    <div id="messages"></div>
    <div>
        <input type="text" id="content" placeholder="输入消息内容">
        <button onclick="sendMessage()">发送</button>
    </div>

    <!-- 旧版 stomp.js 2.3.3 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script>
        let stompClient = null;
        // 固定房间ID
        const currentRoomId = '2086008252532617218';
        // WebSocket 连接地址（根据你的后端 context-path 和端点）
        const wsUrl = 'ws://localhost:8080/api/ws';
        // 应用目的前缀（后端 configureMessageBroker 中设置的，这里假设已改为 /web）
        const appPrefix = '/web';

        function setStatus(text) {
            document.getElementById('status').innerText = text;
        }

        function appendMessage(sender, content, time) {
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<span class="sender">${sender}</span> <span class="time">${time}</span><br><span class="content">${content}</span>`;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        function connectAndSubscribe() {
            // 使用旧版 Stomp.client 创建客户端
            stompClient = Stomp.client(wsUrl);
            stompClient.debug = (str) => console.log('STOMP:', str);

            stompClient.connect({}, function (frame) {
                setStatus('STOMP 连接成功，已订阅房间 ' + currentRoomId);
                console.log('Connected: ' + frame);
                // 订阅房间主题（注意：这里订阅的是 /topic/chat/房间ID）
                stompClient.subscribe('/topic/chat/' + currentRoomId, function (message) {
                    console.log('收到消息:', message.body);
                    // 假设后端返回的 JSON 包含 content 字段，如有其他字段请相应调整
                    const msg = JSON.parse(message.body);
                    const sender = msg.senderId || '未知';
                    const content = msg.content;
                    const time = msg.createdAt || new Date().toLocaleTimeString();
                    appendMessage(sender, content, time);
                });
            }, function (error) {
                setStatus('STOMP 连接失败: ' + error);
                console.error('连接失败:', error);
            });
        }

        function sendMessage() {
            if (!stompClient || !stompClient.connected) {
                alert('请先连接并订阅');
                return;
            }
            const content = document.getElementById('content').value.trim();
            if (!content) {
                alert('消息不能为空');
                return;
            }
            const body = JSON.stringify({ "roomId": "2086008252532617218", "productId": "wqfqf12213322", "senderId": "2085613684788432896", "senderName": "tkn", "content": "aaa", "type": "CHAT", "timestamp": 1787296512030 })

            const headers = {
                'content-type': 'application/json'
            };
            // 发送消息到 /web/chat/房间ID
            stompClient.send(appPrefix + '/chat/' + currentRoomId, { ...headers }, body);
            document.getElementById('content').value = '';
        }

        function disconnect() {
            if (stompClient) {
                stompClient.disconnect();
                setStatus('已主动断开');
                stompClient = null;
            }
        }
    </script>
</body>

</html>
